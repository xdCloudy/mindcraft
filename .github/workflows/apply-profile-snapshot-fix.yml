name: Apply profile snapshot write fix

on:
  push:
    branches:
      - fix/profile-snapshot-write

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/profile-snapshot-write

      - name: Fix synchronous profile snapshot write
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/models/prompter.js')
          text = path.read_text()
          old = '''        writeFileSync(`./bots/${name}/last_profile.json`, JSON.stringify(this.profile, null, 4), (err) => {
            if (err) {
                throw new Error('Failed to save profile:', err);
            }
            console.log("Copy profile saved.");
        });
'''
          new = '''        try {
            writeFileSync(`./bots/${name}/last_profile.json`, JSON.stringify(this.profile, null, 4), 'utf8');
            console.log("Copy profile saved.");
        } catch (err) {
            throw new Error(`Failed to save profile: ${err.message}`, { cause: err });
        }
'''
          if old not in text:
              raise SystemExit('profile snapshot write block not found')
          path.write_text(text.replace(old, new, 1))

      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/apply-profile-snapshot-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/models/prompter.js
          git commit -m 'fix: use writeFileSync with valid options'
          git push origin HEAD:fix/profile-snapshot-write

# Nudge this workflow after initial creation so the push event is registered.
