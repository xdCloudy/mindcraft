name: Autofix PR lint

on:
  push:
    branches:
      - ci/batch-pr-validation-20260818

permissions:
  contents: write

jobs:
  autofix:
    name: "Autofix PR #${{ matrix.pr }}"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - pr: 59
            branch: ce/fix-output-length-handling
          - pr: 60
            branch: ce/fix-reasoning-output-cleanup
          - pr: 61
            branch: ce/fix-openai-api-key-alias
          - pr: 62
            branch: ce/fix-place-block-item-aliases
          - pr: 63
            branch: ce/fix-ses-lockdown
          - pr: 64
            branch: ce/fix-action-manager-state
          - pr: 65
            branch: ce/fix-command-blacklist-registry
          - pr: 66
            branch: ce/fix-conversation-lifecycle
          - pr: 67
            branch: ce/refactor-history-append-only
          - pr: 68
            branch: ce/fix-tts-shell-injection
          - pr: 70
            branch: ce/fix-env-setting-parsing
          - pr: 72
            branch: ce/fix-npc-runtime-bugs
          - pr: 75
            branch: ce/fix-per-agent-settings-lifecycle
          - pr: 76
            branch: ce/fix-build-goal-action-results
          - pr: 77
            branch: ce/fix-coder-initialization
          - pr: 78
            branch: ce/refactor-lan-server-discovery
          - pr: 79
            branch: ce/fix-self-prompter-lifecycle
          - pr: 80
            branch: ce/refactor-profile-resolution

    steps:
      - uses: actions/checkout@v5
        with:
          repository: xdCloudy/mindcraft-dev
          ref: ${{ matrix.branch }}
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '22.13.0'
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Fetch upstream develop
        run: |
          git remote add upstream https://github.com/mindcraft-ce/mindcraft-ce.git 2>/dev/null || true
          git fetch --no-tags upstream develop

      - name: Apply ESLint safe fixes to changed JavaScript
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed_js < <(git diff --name-only --diff-filter=ACMR upstream/develop...HEAD -- '*.js')
          if (( ${#changed_js[@]} )); then
            npx --no-install eslint --fix "${changed_js[@]}" || true
          fi
          git diff --check

      - name: Commit fixes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No mechanical lint fixes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.js'
          git commit -m 'Fix mechanical lint issues'
          git push origin "HEAD:${{ matrix.branch }}"
