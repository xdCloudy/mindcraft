name: Temporary Lint Baseline Stager

on:
  pull_request:
    branches: [ce/ci-validation-workflow]
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: write

jobs:
  stage:
    if: github.event.pull_request.head.ref == 'upstream/full-repo-lint-baseline'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: upstream/full-repo-lint-baseline
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Apply deterministic ESLint fixes
        shell: bash
        run: |
          set -euo pipefail
          cp src/agent/modes.js /tmp/modes.js
          npx eslint src main.js settings.js --fix || true
          # no-floating-promise's autofix changes mode scheduling semantics; keep this file
          # for the explicit semantic pass instead of accepting those automatic awaits.
          cp /tmp/modes.js src/agent/modes.js

      - name: Commit staged fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src main.js settings.js
          if git diff --cached --quiet; then
            echo 'No deterministic fixes to commit.'
            exit 0
          fi
          git commit -m 'style: apply deterministic eslint fixes'
          git push origin HEAD:upstream/full-repo-lint-baseline
