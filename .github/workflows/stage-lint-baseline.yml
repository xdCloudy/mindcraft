name: Stage Lint Baseline

on:
  push:
    branches: ['upstream/full-repo-lint-baseline']
    paths:
      - '.github/workflows/stage-lint-baseline.yml'
  pull_request:
    branches: [develop]

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: upstream/full-repo-lint-baseline
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Apply deterministic lint fixes
        run: npx eslint src main.js settings.js --fix || true
      - name: Repair unsafe mode autofixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('src/agent/modes.js')
          text = p.read_text()
          text = text.replace('async function say(agent, message) {', 'function say(agent, message) {')
          text = text.replace('await say(', 'say(')
          text = text.replace('await execute(', 'execute(')
          for name in ('self_preservation', 'unstuck', 'elbow_room'):
              text = re.sub(rf"(name: '{name}',[\s\S]*?update:) async function", r'\1 function', text, count=1)
          old = 'async function execute(mode, agent, func, timeout=-1) {'
          if old in text:
              text = text.replace(old, '''function execute(mode, agent, func, timeout=-1) {
    void executeMode(mode, agent, func, timeout).catch(error => {
        mode.active = false;
        console.error(`Mode ${mode.name} failed:`, error);
    });
}

async function executeMode(mode, agent, func, timeout=-1) {''', 1)
          p.write_text(text)
          PY
      - name: Commit staged fixes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src main.js settings.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'style: apply deterministic eslint baseline fixes'
          git push origin HEAD:upstream/full-repo-lint-baseline
