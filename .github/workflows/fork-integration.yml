name: Fork Integration CI

on:
  pull_request:
    branches: ['ce/**']

permissions:
  contents: read

concurrency:
  group: fork-integration-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      NODE_OPTIONS: --unhandled-rejections=strict

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Syntax-check JavaScript
        shell: bash
        run: |
          set -euo pipefail
          find src -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check
          if [ -d tests ]; then
            find tests -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check
          fi
          node --check main.js
          node --check settings.js

      - name: Lint changed JavaScript
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' files < <(git diff --name-only --diff-filter=ACMR -z "${{ github.event.pull_request.base.sha }}...HEAD" -- '*.js')
          if (( ${#files[@]} > 0 )); then
            printf 'Linting changed files:\n%s\n' "${files[*]}"
            npx eslint "${files[@]}"
          else
            echo 'No changed JavaScript files.'
          fi

      - name: Test
        run: node --test
