# Temporary batch harness; remove after validation is green.
name: Batch PR validation

on:
  push:
    branches:
      - ci/batch-pr-validation-20260818
  pull_request:
    branches:
      - develop

permissions:
  contents: read

jobs:
  validate:
    name: "PR #${{ matrix.pr }} — ${{ matrix.branch }}"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include:
          - pr: 59
            branch: ce/fix-output-length-handling
          - pr: 60
            branch: ce/fix-reasoning-output-cleanup
          - pr: 61
            branch: ce/fix-openai-api-key-alias
          - pr: 62
            branch: ce/fix-place-block-item-aliases
          - pr: 63
            branch: ce/fix-ses-lockdown
          - pr: 64
            branch: ce/fix-action-manager-state
          - pr: 65
            branch: ce/fix-command-blacklist-registry
          - pr: 66
            branch: ce/fix-conversation-lifecycle
          - pr: 67
            branch: ce/refactor-history-append-only
          - pr: 68
            branch: ce/fix-tts-shell-injection
          - pr: 69
            branch: ce/fix-startup-sequencing
          - pr: 70
            branch: ce/fix-env-setting-parsing
          - pr: 71
            branch: ce/fix-camera-readiness
          - pr: 72
            branch: ce/fix-npc-runtime-bugs
          - pr: 73
            branch: ce/fix-mindserver-state-polling
          - pr: 74
            branch: ce/ci-validation-workflow
          - pr: 75
            branch: ce/fix-per-agent-settings-lifecycle
          - pr: 76
            branch: ce/fix-build-goal-action-results
          - pr: 77
            branch: ce/fix-coder-initialization
          - pr: 78
            branch: ce/refactor-lan-server-discovery
          - pr: 79
            branch: ce/fix-self-prompter-lifecycle
          - pr: 80
            branch: ce/refactor-profile-resolution

    steps:
      - name: Check out PR branch
        uses: actions/checkout@v5
        with:
          repository: xdCloudy/mindcraft-dev
          ref: ${{ matrix.branch }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Fetch upstream develop
        shell: bash
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/mindcraft-ce/mindcraft-ce.git 2>/dev/null || true
          git fetch --no-tags upstream develop

      - name: Syntax-check tracked JavaScript
        shell: bash
        run: |
          set -euo pipefail
          git ls-files -z -- '*.js' | xargs -0 -r -n1 node --check

      - name: Parse tracked JSON
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node -e "JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8'))" "$file"
          done < <(git ls-files -z -- '*.json')

      - name: ESLint added and modified lines
        id: lint
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/lint-changed.mjs" <<'NODE'
          import { execFileSync } from 'node:child_process';
          import path from 'node:path';
          import { ESLint } from 'eslint';

          const base = process.argv[2] || 'upstream/develop';
          const diff = execFileSync(
              'git',
              ['diff', '--unified=0', '--diff-filter=ACMR', `${base}...HEAD`, '--', '*.js'],
              { encoding: 'utf8' }
          );

          const rangesByFile = new Map();
          let currentFile = null;
          for (const line of diff.split('\n')) {
              if (line.startsWith('+++ b/')) {
                  currentFile = line.slice(6);
                  if (!rangesByFile.has(currentFile)) rangesByFile.set(currentFile, []);
                  continue;
              }
              if (!currentFile || !line.startsWith('@@')) continue;
              const match = line.match(/\+(\d+)(?:,(\d+))?/);
              if (!match) continue;
              const start = Number(match[1]);
              const count = match[2] === undefined ? 1 : Number(match[2]);
              if (count > 0) rangesByFile.get(currentFile).push([start, start + count - 1]);
          }

          const files = [...rangesByFile.keys()];
          if (files.length === 0) {
              console.log('No changed JavaScript files.');
              process.exit(0);
          }

          const eslint = new ESLint();
          const results = await eslint.lintFiles(files);
          let failures = 0;

          for (const result of results) {
              const file = path.relative(process.cwd(), result.filePath).split(path.sep).join('/');
              const ranges = rangesByFile.get(file) || [];
              for (const message of result.messages) {
                  const line = message.line || 0;
                  const touchesChangedLine = line === 0 || ranges.some(([start, end]) => line >= start && line <= end);
                  if (!touchesChangedLine) continue;
                  failures += 1;
                  console.error(`${file}:${line}:${message.column || 0} ${message.ruleId || 'eslint'} ${message.message}`);
              }
          }

          if (failures > 0) {
              console.error(`Found ${failures} ESLint issue(s) on lines changed by this PR.`);
              process.exit(1);
          }
          console.log('No ESLint issues on added or modified lines.');
          NODE
          node "$RUNNER_TEMP/lint-changed.mjs" upstream/develop

      - name: Run Node tests
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d tests ]]; then
            mapfile -t tests < <(find tests -type f -name '*.test.js' -print | sort)
          else
            tests=()
          fi
          if (( ${#tests[@]} )); then
            printf 'Running %d test file(s).\n' "${#tests[@]}"
            node --test "${tests[@]}"
          else
            echo 'No tests found.'
          fi

      - name: Check diff whitespace
        id: whitespace
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          git diff --check upstream/develop...HEAD

      - name: Final validation result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          if [[ '${{ steps.lint.outcome }}' != 'success' ]]; then
            echo 'ESLint changed-lines check failed.'
            failed=1
          fi
          if [[ '${{ steps.tests.outcome }}' != 'success' ]]; then
            echo 'Node tests failed.'
            failed=1
          fi
          if [[ '${{ steps.whitespace.outcome }}' != 'success' ]]; then
            echo 'Diff whitespace check failed.'
            failed=1
          fi
          exit "$failed"
