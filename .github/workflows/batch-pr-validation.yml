name: Batch PR validation

on:
  push:
    branches:
      - ci/batch-pr-validation-20260818

permissions:
  contents: read

jobs:
  validate:
    name: "PR #${{ matrix.pr }} — ${{ matrix.branch }}"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include:
          - pr: 59
            branch: ce/fix-output-length-handling
          - pr: 60
            branch: ce/fix-reasoning-output-cleanup
          - pr: 61
            branch: ce/fix-openai-api-key-alias
          - pr: 62
            branch: ce/fix-place-block-item-aliases
          - pr: 63
            branch: ce/fix-ses-lockdown
          - pr: 64
            branch: ce/fix-action-manager-state
          - pr: 65
            branch: ce/fix-command-blacklist-registry
          - pr: 66
            branch: ce/fix-conversation-lifecycle
          - pr: 67
            branch: ce/refactor-history-append-only
          - pr: 68
            branch: ce/fix-tts-shell-injection
          - pr: 69
            branch: ce/fix-startup-sequencing
          - pr: 70
            branch: ce/fix-env-setting-parsing
          - pr: 71
            branch: ce/fix-camera-readiness
          - pr: 72
            branch: ce/fix-npc-runtime-bugs
          - pr: 73
            branch: ce/fix-mindserver-state-polling
          - pr: 74
            branch: ce/ci-validation-workflow
          - pr: 75
            branch: ce/fix-per-agent-settings-lifecycle
          - pr: 76
            branch: ce/fix-build-goal-action-results
          - pr: 77
            branch: ce/fix-coder-initialization
          - pr: 78
            branch: ce/refactor-lan-server-discovery
          - pr: 79
            branch: ce/fix-self-prompter-lifecycle
          - pr: 80
            branch: ce/refactor-profile-resolution

    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          repository: xdCloudy/mindcraft-dev
          ref: ${{ matrix.branch }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Fetch upstream develop
        shell: bash
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/mindcraft-ce/mindcraft-ce.git 2>/dev/null || true
          git fetch --no-tags upstream develop

      - name: Syntax-check tracked JavaScript
        shell: bash
        run: |
          set -euo pipefail
          git ls-files -z -- '*.js' | xargs -0 -r -n1 node --check

      - name: Parse tracked JSON
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node -e "JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8'))" "$file"
          done < <(git ls-files -z -- '*.json')

      - name: ESLint JavaScript changed by PR
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed_js < <(git diff --name-only --diff-filter=ACMR upstream/develop...HEAD -- '*.js')
          if (( ${#changed_js[@]} )); then
            printf 'Linting %s\n' "${changed_js[@]}"
            npx --no-install eslint "${changed_js[@]}"
          else
            echo 'No changed JavaScript files.'
          fi

      - name: Run Node tests
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d tests ]]; then
            mapfile -t tests < <(find tests -type f -name '*.test.js' -print | sort)
          else
            tests=()
          fi
          if (( ${#tests[@]} )); then
            printf 'Running %d test file(s).\n' "${#tests[@]}"
            node --test "${tests[@]}"
          else
            echo 'No tests found.'
          fi

      - name: Check diff whitespace
        shell: bash
        run: |
          set -euo pipefail
          git diff --check upstream/develop...HEAD
